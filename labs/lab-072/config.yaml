metadata:
  name: "ats-004-lab-072"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-072-setup"
      description: "Launches a rogue write daemon writing heavily to a log file"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-iotop-audit"
      description: "Confirms proper profiling of the rogue writing process and target file"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
