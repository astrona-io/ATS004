training:
  id: ATS004
  title: "LFCS: Storage"
  description: >
    Training material covering the Linux Foundation Certified System
    Administrator (LFCS) Storage domain, with hands-on labs for each
    competency.

  certification:
    name: Linux Foundation Certified System Administrator
    code: LFCS
    provider: Linux Foundation
    domain: Storage
    weight: 20

modules:
  - id: module-010
    title: "Section 010: Local Storage Preparation & Forensics"
    description: >
      Move from treating storage as an abstract folder to managing the
      physical and logical block layers directly on raw disk metal: disk
      discovery, partition design, data-at-rest encryption, filesystem
      maintenance and forensics, and making filesystems mount persistently
      at boot with /etc/fstab and systemd mount units.

