metadata:
  name: "ats-004-lab-015"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    extraDisks:
      - sizeGB: 1
        serial: "lab015-data1"
    display: false

bootstrap:
  init:
    - name: "lab-015-setup"
      description: "Ensures raw disk is available"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-fstab-entry"
      description: "Confirms UUID-keyed, correctly-optioned, persistent fstab entry"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
