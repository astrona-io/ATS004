metadata:
  name: "ats-004-lab-051"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-051-setup"
      description: "Installs autofs and creates a bind source directory"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-autofs-direct"
      description: "Confirms autofs direct map mounting and timeout values"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
