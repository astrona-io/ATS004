metadata:
  name: "ats-004-lab-031"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    extraDisks:
      - sizeGB: 2
        serial: "lab031-disk1"
    display: false

bootstrap:
  init:
    - name: "lab-031-setup"
      description: "Ensures raw disk is available"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-pv-created"
      description: "Confirms lab031-disk1 was initialised as an LVM Physical Volume (step 2)"
      type: "file"
      source: "validation/validate-pv.sh"

    - name: "verify-vg-created"
      description: "Confirms vg_data exists and pools the lab031-disk1 PV (step 3)"
      type: "file"
      source: "validation/validate-vg.sh"

    - name: "verify-lv-created"
      description: "Confirms lv_storage exists at roughly 500M inside vg_data (step 4)"
      type: "file"
      source: "validation/validate-lv.sh"

    - name: "verify-filesystem-and-mount"
      description: "Confirms lv_storage is formatted ext4 and mounted at /mnt/lvm-storage (steps 5-6)"
      type: "file"
      source: "validation/validate-mount.sh"

teardown:
  keepCluster: false
