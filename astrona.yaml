  - id: module-030
    title: "Section 030: Dynamic & Redundant Volumes (LVM & RAID)"
    description: >
      Combine raw disks into a single managed block device. LVM pools
      physical disks and slices out flexible logical volumes that can be
      expanded, migrated, or shrunk on the fly; software RAID (mdadm)
      builds fault-tolerant arrays that survive a disk failure and rebuild
      onto a replacement without downtime.

