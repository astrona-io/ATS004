metadata:
  name: "ats-004-lab-013"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    extraDisks:
      - sizeGB: 2
        serial: "lab013-corrupt"
    display: false

bootstrap:
  init:
    - name: "lab-013-setup"
      description: "Generates a corrupted filesystem"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-repair"
      description: "Confirms filesystem repair, label, and persistent UUID mount"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
