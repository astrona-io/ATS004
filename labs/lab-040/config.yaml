metadata:
  name: "ats-004-lab-040"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

    # NOTE: astrona-cli's extraDisks are NOT guaranteed to land on
    # /dev/vdb -- they can enumerate BEFORE the main disk, so a raw
    # letter guess here risks partitioning the VM's own root disk.
    # bootstrap/validation below resolve this disk via `serial` +
    # /dev/disk/by-id/virtio-<serial> instead. Bootstrap partitions it
    # into one unformatted partition (the scenario's "freed up" swap
    # partition) — the student identifies and activates it themselves.
    extraDisks:
      - sizeGB: 1
        serial: "lab040-swap"

bootstrap:
  init:
    - name: "prepare-swap-state"
      description: "Deactivates/strips any pre-existing swap so the VM starts with none active, and partitions the extra disk (resolved by serial) into one unformatted partition"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-swapfile-active"
      description: "Confirms a ~2G file-type swap area is active"
      type: "file"
      source: "validation/validate-swapfile-active.sh"

    - name: "verify-swapfile-perms"
      description: "Confirms the active swap file's mode is 600"
      type: "file"
      source: "validation/validate-swapfile-perms.sh"

    - name: "verify-swapfile-fstab"
      description: "Confirms the swap file is persisted in /etc/fstab with type swap"
      type: "file"
      source: "validation/validate-swapfile-fstab.sh"

    - name: "verify-swapfile-priority"
      description: "Confirms the swap file's active priority is 5"
      type: "file"
      source: "validation/validate-swapfile-priority.sh"

    - name: "verify-partition-swap-active"
      description: "Confirms the extra disk's first partition (resolved by serial, not a guessed letter) is active as partition-type swap"
      type: "file"
      source: "validation/validate-partition-swap-active.sh"

    - name: "verify-partition-priority"
      description: "Confirms that partition's active priority is 10, preferred over the swap file's 5"
      type: "file"
      source: "validation/validate-partition-priority.sh"

teardown:
  keepCluster: false
