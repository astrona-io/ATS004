metadata:
  name: "ats-004-lab-086"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    extraDisks:
      - sizeGB: 2
        serial: "lab086-disk1"
    display: false

bootstrap:
  init:
    - name: "lab-086-setup"
      description: "Sets up an XFS-formatted logical volume with sample data"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-xfs-grow"
      description: "Confirms lv_xfs was grown with lvextend and the XFS filesystem was grown with xfs_growfs, data intact"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
