# Course manifest for ATS004 - LFCS: Storage (Linux Foundation Certified
# System Administrator).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's wrap-up page
# comes last. The section quiz and the section capstone close the section.
# Playgrounds are not listed: the landing page's playground marker shows
# them. Never list solution.md.
#
# Every `path:` is relative to this file.

training:
  id: ATS004
  title: "LFCS: Storage"
  description: >
    Training material covering the Linux Foundation Certified System
    Administrator (LFCS) Storage domain, with hands-on labs for each
    competency.

  certification:
    name: Linux Foundation Certified System Administrator
    code: LFCS
    provider: Linux Foundation
    domain: Storage
    weight: 20

modules:

  - id: module-010
    title: "Section 010: Local Storage Preparation & Forensics"
    description: >
      Move from treating storage as an abstract folder to managing the
      physical and logical block layers directly on raw disk metal: disk
      discovery, partition design, data-at-rest encryption, filesystem
      maintenance and forensics, and making filesystems mount persistently
      at boot with /etc/fstab and systemd mount units.

    content:
      - type: reading
        title: "Section Overview"
        path: sections/section-010/README.md

      - type: reading
        title: "The Lifecycle of Local Storage"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "Discovery, Formatting and Mounting"
        path: sections/section-010/module-01/course-01-discovery-formatting-mounting.md
      - type: reading
        title: Question
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Filesystem Creation & Mounting Sandbox Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 15m
        topic: filesystems
        task_kind: build
        tags: [lsblk, blkid, mkfs, ext4, mount, findmnt]
        learning_goals:
          - Find the raw disk among the attached block devices without guessing its device name
          - Format the disk with ext4 and mount it on the new directory /mnt/backup-black
          - Create a marker file on the mounted filesystem to prove it is writable
        resources:
          - name: "lsblk(8) manual page"
            url: https://man7.org/linux/man-pages/man8/lsblk.8.html
          - name: "mke2fs(8) manual page"
            url: https://man7.org/linux/man-pages/man8/mke2fs.8.html
