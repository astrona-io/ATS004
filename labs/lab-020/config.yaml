metadata:
  name: "ats-004-lab-020"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  # lab-net is this scenario's private subnet: terminal is the SSHFS
  # client + NFS server, app-srv1 is the SSHFS/NFS-export source + NFS
  # client, both reachable at real, static addresses.
  networks:
    - name: "lab-net"
      cidr: "10.10.40.0/24"

  qemu:
    - name: "terminal"
      image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

      cpus: 2
      memoryMB: 2048
      diskSizeGB: 15
      display: false

      sshAccess:
        - "app-srv1"

      networks:
        - name: "lab-net"
          ipv4: "10.10.40.5"

      bootstrap:
        init:
          - name: "terminal-lab-setup"
            description: "Installs sshfs and nfs-kernel-server, creates the local mountpoints and share directory, and seeds /etc/hosts with app-srv1's address"
            type: "folder"
            source: "bootstrap/terminal/"

      validation:
        scripts:
          - name: "verify-sshfs-mount"
            description: "Confirms /app-srv1/data-export is mounted via fuse.sshfs, read-write, with allow_other set"
            type: "file"
            source: "validation/validate-sshfs-mount.sh"

          - name: "verify-nfs-export-config"
            description: "Confirms /nfs/share is exported read-only to 10.10.40.0/24"
            type: "file"
            source: "validation/validate-nfs-export.sh"

    - name: "app-srv1"
      image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

      cpus: 2
      memoryMB: 2048
      diskSizeGB: 15
      display: false
      networks:
        - name: "lab-net"
          ipv4: "10.10.40.10"

      bootstrap:
        init:
          - name: "app-srv1-lab-setup"
            description: "Installs openssh-server and nfs-common, creates /data-export with a sample file, and seeds /etc/hosts with terminal's address"
            type: "folder"
            source: "bootstrap/app-srv1/"

      validation:
        scripts:
          - name: "verify-nfs-mount"
            description: "Confirms /nfs/terminal/share is mounted from terminal's NFS export, type nfs, read-only"
            type: "file"
            source: "validation/validate-nfs-mount.sh"

teardown:
  keepCluster: false
