metadata:
  name: "ats-004-lab-052"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-052-setup"
      description: "Installs autofs, NFS packages, and creates subdirectories"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-autofs-wildcards"
      description: "Confirms autofs indirect wildcard maps for NFS clients"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
