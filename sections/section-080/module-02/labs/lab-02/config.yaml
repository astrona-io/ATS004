metadata:
  name: "ats-004-lab-085"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    extraDisks:
      - sizeGB: 2
        serial: "lab085-quota"
    display: false

bootstrap:
  init:
    - name: "lab-085-setup"
      description: "Prepares an ext4 filesystem with quotas already enabled and a tight limit set for carol"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-quota-enforcement-and-grace"
      description: "Confirms the hard limit was actually enforced and the grace-period state was captured"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
