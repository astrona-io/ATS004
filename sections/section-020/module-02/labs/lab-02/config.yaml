metadata:
  name: "ats-004-lab-020-02-02"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-020-02-02-setup"
      description: "Prepares an SSH user with a key for root, an NFS export for the wrong network, and two empty mount points"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-persistent-remote-mounts"
      description: "Unmounts both shares, runs mount -a, and confirms both come back from /etc/fstab"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
