metadata:
  name: "ats-004-lab-081"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    extraDisks:
      - sizeGB: 2
        serial: "lab081-disk"
    display: false

bootstrap:
  init:
    - name: "lab-081-setup"
      description: "Sets up directories and nested mountpoints to test local device boundary checking"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-du-audit"
      description: "Confirms proper directory capacity auditing restricted to local device boundaries"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
