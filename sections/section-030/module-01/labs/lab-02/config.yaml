metadata:
  name: "ats-004-lab-037"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    extraDisks:
      - sizeGB: 1
        serial: "lab037-disk1"
      - sizeGB: 1
        serial: "lab037-disk2"
    display: false

bootstrap:
  init:
    - name: "lab-037-setup"
      description: "Ensures both raw disks are available"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-lvm-pooling"
      description: "Confirms two PVs pooled into one VG and the LV's extents span both disks"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
