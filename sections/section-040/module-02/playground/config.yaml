# Permanent Swap Partitions & Priority Scheduling (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "section-040-module-02-playground"
  docs:
    guide: "docs/overview.md"

runtime:
  type: "qemu"
  qemu:
    - image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"
      cpus: 2
      memoryMB: 2048
      diskSizeGB: 15
      extraDisks:
        - sizeGB: 1
          serial: "s40m02-swap"
      display: false
      sshPasswordAuth: false

bootstrap:
  init:
    - name: "prepare"
      description: "OS prep only: wipe the spare disk raw, back up /etc/fstab, report memory/swap state."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests: []

teardown:
  keepCluster: false
