metadata:
  name: "ats-004-lab-037"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    extraDisks:
      - sizeGB: 1
        serial: "lab037-disk1"
      - sizeGB: 1
        serial: "lab037-disk2"
    display: false

bootstrap:
  init:
    - name: "lab-037-setup"
      description: "Ensures both raw disks are available"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-pvs-created"
      description: "Confirms both disks were initialised as LVM Physical Volumes (step 1)"
      type: "file"
      source: "validation/validate-pvs.sh"

    - name: "verify-vg-pooled"
      description: "Confirms vg_pool exists and pools exactly 2 PVs (step 2)"
      type: "file"
      source: "validation/validate-vg.sh"

    - name: "verify-lv-created"
      description: "Confirms lv_wide exists at roughly 1500M inside vg_pool (step 3)"
      type: "file"
      source: "validation/validate-lv.sh"

    - name: "verify-filesystem-and-mount"
      description: "Confirms lv_wide is formatted ext4 and mounted at /mnt/lvm-wide (steps 4-5)"
      type: "file"
      source: "validation/validate-mount.sh"

    - name: "verify-extents-span-both-disks"
      description: "Confirms lv_wide's extents actually landed on both physical disks (step 6)"
      type: "file"
      source: "validation/validate-span.sh"

teardown:
  keepCluster: false
