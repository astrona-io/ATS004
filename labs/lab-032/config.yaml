metadata:
  name: "ats-004-lab-032"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    extraDisks:
      - sizeGB: 2
        serial: "lab032-disk1"
      - sizeGB: 2
        serial: "lab032-disk2"
    display: false

bootstrap:
  init:
    - name: "lab-032-setup"
      description: "Sets up LVM spanning two disks with an active LV on disk1"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-pvmove"
      description: "Confirms extent migration and removal of disk1 from the VG"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
