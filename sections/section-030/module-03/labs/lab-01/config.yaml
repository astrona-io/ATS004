metadata:
  name: "ats-004-lab-033"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    extraDisks:
      - sizeGB: 1
        serial: "lab033-a"
      - sizeGB: 1
        serial: "lab033-b"
      - sizeGB: 1
        serial: "lab033-c"
    display: false

bootstrap:
  init:
    - name: "lab-033-setup"
      description: "Ensures the three raw disks are available and free of RAID/filesystem signatures"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-raid5-array"
      description: "Confirms a persistent RAID 5 array, formatted, mounted, and fstab-entered"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
