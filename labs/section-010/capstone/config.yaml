metadata:
  name: "ats-004-lab-010"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    # Main disk: the VM's root filesystem.
    diskSizeGB: 15
    # NOTE: astrona-cli's current qemu arg-builder mixes "-drive if=virtio"
    # (main disk + cloud-init seed) with explicit "-device virtio-blk-pci"
    # (extraDisks), which does NOT guarantee extraDisks land on
    # /dev/vdb/vdc/vdd as the extraDisks docs claim -- in practice the
    # extraDisks have shown up BEFORE the main disk in guest enumeration
    # (e.g. vda/vdb/vdc = the three extraDisks, vdd = the main/root disk).
    # Never assume a raw /dev/vdX letter here. bootstrap/validation below
    # resolve the two disks they manage via `serial` + the stable
    # /dev/disk/by-id/virtio-<serial> path instead, and the scenario asks
    # the student to identify the blank disk with `lsblk`, not by name.
    extraDisks:
      - sizeGB: 1   # blank, student formats/mounts it (identified via lsblk)
        serial: "lab010-scratch"
      - sizeGB: 3   # pre-filled to ~70% used ("backup-blue")
        serial: "lab010-blue"
      - sizeGB: 3   # pre-filled to ~33% used ("backup-red")
        serial: "lab010-red"
    display: false

bootstrap:
  init:
    - name: "lab-010-setup"
      description: "Formats/fills vdc and vdd to different usage levels, and starts dark-matter-v1/v2 as long-running processes with a deliberate memory gap (v2's binary lives on /mnt/backup-red)"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-scratch-disk-formatted-mounted"
      description: "Confirms an ext4 filesystem is mounted at /mnt/backup-black, regardless of which /dev/vdX it landed on"
      type: "file"
      source: "validation/validate-scratch-disk-formatted-mounted.sh"

    - name: "verify-completed-file"
      description: "Confirms /mnt/backup-black/completed exists as an empty regular file"
      type: "file"
      source: "validation/validate-completed-file.sh"

    - name: "verify-trash-emptied"
      description: "Confirms the disk with higher df Used (computed live, not hardcoded) has an empty .trash directory"
      type: "file"
      source: "validation/validate-trash-emptied.sh"

    - name: "verify-busier-process-disk-unmounted"
      description: "Confirms the disk backing dark-matter-v2's executable (/mnt/backup-red, the higher-memory process) is unmounted"
      type: "file"
      source: "validation/validate-process-disk-unmounted.sh"

teardown:
  keepCluster: false
