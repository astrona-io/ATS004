metadata:
  name: "ats-004-lab-060"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "procfs-lab-setup"
      description: "Resets net.ipv4.ip_forward to disabled/unpersisted, and deploys a target process with a known open-FD count at /opt/course/target.pid"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-ip-forward-live"
      description: "Confirms net.ipv4.ip_forward is live-enabled (1) via /proc/sys"
      type: "file"
      source: "validation/validate-ip-forward-live.sh"

    - name: "verify-ip-forward-not-persisted"
      description: "Confirms net.ipv4.ip_forward=1 was not written into /etc/sysctl.conf or /etc/sysctl.d/*.conf, proving the change was live-only"
      type: "file"
      source: "validation/validate-ip-forward-not-persisted.sh"

teardown:
  keepCluster: false
