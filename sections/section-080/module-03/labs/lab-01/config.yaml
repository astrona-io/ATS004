metadata:
  name: "ats-004-lab-084"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    extraDisks:
      - sizeGB: 2
        serial: "lab084-xfsquota"
    display: false

bootstrap:
  init:
    - name: "lab-084-setup"
      description: "Mounts an XFS filesystem with uquota,pquota and creates test users"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-xfs-project-quota"
      description: "Confirms alice's user quota and the webdata project quota"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
