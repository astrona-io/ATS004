# RAID Maintenance and Recovery (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "section-030-module-04-playground"
  docs:
    guide: "docs/overview.md"

runtime:
  type: "qemu"
  qemu:
    - image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"
      cpus: 2
      memoryMB: 2048
      diskSizeGB: 15
      extraDisks:
        - sizeGB: 1
          serial: "s090m02-a"
        - sizeGB: 1
          serial: "s090m02-b"
        - sizeGB: 1
          serial: "s090m02-c"
        - sizeGB: 1
          serial: "s090m02-d"
      display: false
      sshPasswordAuth: false

bootstrap:
  init:
    - name: "prepare"
      description: "OS prep: build a 3-disk RAID5 at /dev/md0 with an ext4 fs mounted at /mnt/raid and data; leave the 4th disk as a raw spare."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests: []

teardown:
  keepCluster: false
