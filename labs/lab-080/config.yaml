metadata:
  name: "ats-004-lab-080"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    # NOTE: astrona-cli's current qemu arg-builder mixes "-drive if=virtio"
    # (main disk + cloud-init seed) with explicit "-device virtio-blk-pci"
    # (extraDisks), which does NOT guarantee extraDisks land on
    # /dev/vdb/vdc/... as the extraDisks docs claim -- in practice
    # extraDisks have shown up BEFORE the main disk in guest enumeration
    # (e.g. with one extraDisk: vda = the extraDisk, vdb = the main/root
    # disk). Never assume a raw /dev/vdX letter here. bootstrap below
    # resolves this disk via `serial` + the stable
    # /dev/disk/by-id/virtio-<serial> path instead. This disk stands in
    # for the scenario's "large NFS mount under /mnt" that a du scan must
    # not fold into /'s size report; it's identified by its /mnt/bigshare
    # mountpoint everywhere else in this lab, never by device letter.
    extraDisks:
      - sizeGB: 2
        serial: "lab080-bigshare"
    display: false

bootstrap:
  init:
    - name: "dirsizes-lab-setup"
      description: "Creates /opt/course/audit, and formats/mounts the extra disk at /mnt/bigshare with a large dummy file so the mount-boundary requirement is testable end-to-end"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-dirsizes-exists"
      description: "Confirms /opt/course/audit/dirsizes.txt exists and is non-empty"
      type: "file"
      source: "validation/validate-dirsizes-exists.sh"

    - name: "verify-dirsizes-sorted-descending"
      description: "Confirms dirsizes.txt entries are sorted largest first"
      type: "file"
      source: "validation/validate-dirsizes-sorted.sh"

    - name: "verify-dirsizes-excludes-pseudo-fs"
      description: "Confirms dirsizes.txt contains no /proc, /sys, /dev, or /run entries"
      type: "file"
      source: "validation/validate-dirsizes-excludes-pseudo-fs.sh"

    - name: "verify-dirsizes-respects-mount-boundary"
      description: "Confirms the /mnt entry (if present) is small, proving du -x kept the scan from crossing into the bigshare mount"
      type: "file"
      source: "validation/validate-dirsizes-mount-boundary.sh"

    - name: "verify-symlinks-exists"
      description: "Confirms /opt/course/audit/symlinks.txt exists, is non-empty, and every listed path is a real symlink"
      type: "file"
      source: "validation/validate-symlinks-exists.sh"

teardown:
  keepCluster: false
