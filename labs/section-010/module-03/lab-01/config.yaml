metadata:
  name: "ats-004-lab-012"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    extraDisks:
      - sizeGB: 2
        serial: "lab012-raw"
    display: false

bootstrap:
  init:
    - name: "lab-012-setup"
      description: "Ensures extra disk is raw"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-luks"
      description: "Confirms LUKS container, formatting, and mounting"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
