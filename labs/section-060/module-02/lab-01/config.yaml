metadata:
  name: "ats-004-lab-062"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-062-setup"
      description: "Disables packet forwarding initially"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-sysctl"
      description: "Confirms live and persistent kernel forwarding state"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
