# Directory Capacity Auditing (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "section-080-module-01-playground"
  docs:
    guide: "docs/overview.md"

runtime:
  type: "qemu"
  qemu:
    - image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"
      cpus: 2
      memoryMB: 2048
      diskSizeGB: 15
      extraDisks:
        - sizeGB: 3
          serial: "s80m01-data"
      display: false
      sshPasswordAuth: false

bootstrap:
  init:
    - name: "prepare"
      description: "OS prep only: mount a second ext4 fs at /data, seed a large real file, a sparse file, and some /opt data for du to find."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests: []

teardown:
  keepCluster: false
