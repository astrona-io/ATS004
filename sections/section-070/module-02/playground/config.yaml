# Process-Level Auditing: Identifying the Culprit (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "section-070-module-02-playground"
  docs:
    guide: "docs/overview.md"

runtime:
  type: "qemu"
  qemu:
    - image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"
      cpus: 2
      memoryMB: 2048
      diskSizeGB: 15
      extraDisks:
        - sizeGB: 4
          serial: "s70m02-perf"
      display: false
      sshPasswordAuth: false

bootstrap:
  init:
    - name: "prepare"
      description: "OS prep only: install iotop/sysstat/lsof/fio, mount an ext4 fs at /mnt/perf, enable task delay accounting, add a load helper."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests: []

teardown:
  keepCluster: false
