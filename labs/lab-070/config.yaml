metadata:
  name: "ats-004-lab-070"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    # NOTE: astrona-cli's current qemu arg-builder mixes "-drive if=virtio"
    # (main disk + cloud-init seed) with explicit "-device virtio-blk-pci"
    # (extraDisks), which does NOT guarantee extraDisks land on /dev/vdb as
    # the extraDisks docs claim -- in practice a single extraDisks entry
    # has shown up as /dev/vda, with /dev/vdb actually being the main/root
    # disk. Never assume a raw /dev/vdX letter here. bootstrap/validation
    # below resolve this disk via `serial` + the stable
    # /dev/disk/by-id/virtio-<serial> path instead.
    #
    # A blank scratch disk that bootstrap formats, mounts at
    # /mnt/data-ingest, and drives with a continuous write loop — the real
    # I/O bottleneck the student diagnoses with vmstat/iostat/iotop.
    extraDisks:
      - sizeGB: 3
        serial: "lab070-ingest"
    display: false

bootstrap:
  init:
    - name: "io-load-setup"
      description: "Installs sysstat/iotop, formats and mounts the lab070-ingest extra disk (resolved via /dev/disk/by-id, not a raw letter) at /mnt/data-ingest, and starts a continuous write-heavy 'data-ingest-job' background service against it so the I/O bottleneck is real and measurable"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-io-report-exists"
      description: "Confirms /opt/course/audit/io-report.txt exists with all five expected keys (device, pid, process, direction, mountpoint)"
      type: "file"
      source: "validation/validate-io-report-exists.sh"

    - name: "verify-io-report-device"
      description: "Confirms the reported device references the disk actually mounted at /mnt/data-ingest, resolved live rather than hardcoded"
      type: "file"
      source: "validation/validate-io-report-device.sh"

    - name: "verify-io-report-process"
      description: "Confirms the reported process names data-ingest-job, the actual load generator"
      type: "file"
      source: "validation/validate-io-report-process.sh"

    - name: "verify-io-report-direction"
      description: "Confirms the reported direction is 'write', matching the dd write-loop load"
      type: "file"
      source: "validation/validate-io-report-direction.sh"

    - name: "verify-io-report-mountpoint"
      description: "Confirms the reported mountpoint is /mnt/data-ingest, where the busy device is actually mounted"
      type: "file"
      source: "validation/validate-io-report-mountpoint.sh"

teardown:
  keepCluster: false
