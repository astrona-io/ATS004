metadata:
  name: "ats-004-lab-021"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-021-setup"
      description: "Installs SSHFS, configures sshuser, and populates source directory"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-sshfs"
      description: "Confirms SSHFS mount is active and files are accessible"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
