metadata:
  name: "ats-004-lab-020-02-02"
  docs:
    solution: "solution.md"
    question: "question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-020-02-02-setup"
      description: "Prepares an SSH user with a key for root, an NFS export for the wrong network, and two empty mount points"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-persistent-remote-mounts"
      description: "Unmounts both shares, runs mount -a, and confirms both come back from /etc/fstab"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
